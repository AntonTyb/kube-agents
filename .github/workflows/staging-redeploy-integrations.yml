name: Staging Redeploy Integrations

on:
  push:
    tags:
      - "staging/**"

concurrency:
  group: staging-redeploy-integrations
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # zizmor: ignore[secrets-inherit] - internal reusable workflow
  call-deploy:
    permissions:
      contents: read
      id-token: write
    # zizmor: ignore[secrets-inherit] - internal reusable workflow
    secrets: inherit
    # zizmor: ignore[secrets-inherit] - internal reusable workflow
    uses: ./.github/workflows/reusable-deploy-integrations.yml
    with:
      target_environment: "staging"
      force_deploy: true
      checkout_ref: ${{ github.ref }}
