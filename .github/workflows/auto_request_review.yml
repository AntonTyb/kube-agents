name: Auto Request Review

on:
  pull_request_target:
    types: [opened, ready_for_review, reopened]

permissions:
  contents: read

jobs:
  auto-request-review:
    name: Auto Request Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Request review based on files changes and/or groups the author belongs to
        uses: necojackarc/auto-request-review@5428987ee96c21e64ff477c7f66a2b8e217d121c # v0.13.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
