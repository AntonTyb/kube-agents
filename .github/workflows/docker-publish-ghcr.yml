name: Publish to GHCR

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  publish-ghcr:
    runs-on: ubuntu-latest
    if: github.repository == 'gke-labs/kube-agents'
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Load tags
        run: cat tags.env >> "$GITHUB_ENV"

      - name: Downcase repository name
        env:
          GITHUB_REPO: ${{ github.repository }}
        run: |
          echo "IMAGE_REPOSITORY=$(echo "$GITHUB_REPO" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.7.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Platform Agent (GHCR)
        uses: docker/build-push-action@v6.9.2
        id: build-platform
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: platform
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/platform-agent:latest
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/platform-agent:${{ github.sha }}
          build-args: |
            HERMES_AGENT_TAG=${{ env.HERMES_AGENT_TAG }}

      - name: Build and Push Replay Proxy (GHCR)
        uses: docker/build-push-action@v6.9.2
        id: build-replay-proxy
        with:
          context: examples/inference-replay/replay-proxy
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/replay-proxy:latest
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/replay-proxy:${{ github.sha }}

      - name: Build and Push Credential Sidecar (GHCR)
        uses: docker/build-push-action@v6.9.2
        id: build-credential-proxy
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: credential-proxy
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/credential-proxy:latest
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/credential-proxy:${{ github.sha }}
          build-args: |
            HERMES_AGENT_TAG=${{ env.HERMES_AGENT_TAG }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.0

      - name: Sign the images
        env:
          PLATFORM_DIGEST: ${{ steps.build-platform.outputs.digest }}
          REPLAY_DIGEST: ${{ steps.build-replay-proxy.outputs.digest }}
          CREDENTIAL_DIGEST: ${{ steps.build-credential-proxy.outputs.digest }}
        run: |
          cosign sign --yes "ghcr.io/${IMAGE_REPOSITORY}/platform-agent@${PLATFORM_DIGEST}"
          cosign sign --yes "ghcr.io/${IMAGE_REPOSITORY}/replay-proxy@${REPLAY_DIGEST}"
          cosign sign --yes "ghcr.io/${IMAGE_REPOSITORY}/credential-proxy@${CREDENTIAL_DIGEST}"
