name: Publish Helm Charts to OCI (GHCR)

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish-charts:
    runs-on: ubuntu-latest
    if: github.repository == 'gke-labs/kube-agents'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1

      - name: Log in to GHCR via Helm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Extract SemVer version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="$REF_NAME"
          echo "VERSION=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Lint, Package and Push Canonical Chart
        env:
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          REPO_DOWNCASE=$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')
          helm lint charts/kube-agents
          helm package charts/kube-agents --version "$VERSION" --app-version "$REF_NAME" --destination /tmp/charts
          helm push "/tmp/charts/kube-agents-${VERSION}.tgz" "oci://ghcr.io/${REPO_DOWNCASE}/charts"
