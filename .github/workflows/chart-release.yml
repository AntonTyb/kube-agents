name: Publish Helm Charts to OCI (GHCR)

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish-charts:
    runs-on: ubuntu-latest
    if: github.repository == 'gke-labs/kube-agents'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@b9e51907a09c3e6b493c4216a8159bb8a68b5a75 # v4.2.0

      - name: Log in to GHCR via Helm
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Extract SemVer version
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          echo "VERSION=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Lint, Package and Push Canonical Chart
        run: |
          REPO_DOWNCASE=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          helm lint charts/kube-agents
          helm package charts/kube-agents --version ${{ steps.version.outputs.VERSION }} --app-version ${{ github.ref_name }} --destination /tmp/charts
          helm push /tmp/charts/kube-agents-${{ steps.version.outputs.VERSION }}.tgz oci://ghcr.io/${REPO_DOWNCASE}/charts
