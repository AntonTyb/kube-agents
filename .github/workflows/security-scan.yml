name: Security Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1" # Weekly Monday scan

permissions:
  contents: read

jobs:
  gosec-scan:
    name: Go Security Scan (gosec)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run gosec
        uses: securego/gosec@5d1a18b12ab7a9858baf9b7cffa903028792ed17 # v2.22.0
        with:
          workdir: k8s-operator
          args: "-no-fail -no-fail-on-error ./..."

  trivy-scan:
    name: Container & Manifest Scan (trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Scan Repository Configs & Manifests
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "config"
          exit-code: "1"
          severity: "HIGH,CRITICAL"

  semgrep-scan:
    name: SAST Scan (semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.82.0@sha256:4a38618e7c10c14b98d1a10065aefc8c1050beab45eead11b33da07d7ccbeec1
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run semgrep
        run: semgrep ci --config=p/security-audit

  checkov-scan:
    name: IaC Security Scan (checkov)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@69437f47399a9e321cd0f08938cb5cf2bb846dba # v12.2928.0
        with:
          framework: all
          output_format: cli
          soft_fail: true
