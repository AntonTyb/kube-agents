# zizmor: ignore[dependabot-cooldown]
version: 2
updates:
  # GitHub Actions Workflows
  # zizmor: ignore[dependabot-cooldown]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"

  # Go Ecosystem (Operator)
  # zizmor: ignore[dependabot-cooldown]
  - package-ecosystem: "gomod"
    directory: "/k8s-operator"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "deps"

  # Python Ecosystem (E2E Tests)
  # zizmor: ignore[dependabot-cooldown]
  - package-ecosystem: "pip"
    directory: "/tests/e2e"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"

  # Node.js Ecosystem (Root Linters & Tooling)
  # zizmor: ignore[dependabot-cooldown]
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "deps"

  # Docker Ecosystems
  # zizmor: ignore[dependabot-cooldown]
  - package-ecosystem: "docker"
    directory: "/deploy/docker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "ci"

  # zizmor: ignore[dependabot-cooldown]
  - package-ecosystem: "docker"
    directory: "/agents/platform"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "ci"
