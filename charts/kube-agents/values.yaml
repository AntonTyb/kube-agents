operator:
  enabled: true
  enableWebhooks: false
  image:
    repository: ghcr.io/gke-labs/kube-agents/k8s-operator
    tag: "" # defaults to Chart.appVersion
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

platformAgent:
  enabled: true
  name: platform-agent
  harness:
    clusterName: "my-cluster"
    location: "us-central1"
    projectId: "my-project"
  deployment:
    image:
      repository: ghcr.io/gke-labs/kube-agents/platform-agent
      tag: "" # defaults to Chart.appVersion
      pullPolicy: IfNotPresent
