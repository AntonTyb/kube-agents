{{- if and .Values.platformAgent.enabled .Values.platformAgent.credentials.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.platformAgent.credentials.secretName | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    {{- include "kube-agents.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- toYaml .Values.platformAgent.credentials.data | nindent 2 }}
{{- end }}
