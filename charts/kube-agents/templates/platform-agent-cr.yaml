{{- if .Values.platformAgent.enabled }}
apiVersion: kubeagents.x-k8s.io/v1alpha1
kind: PlatformAgent
metadata:
  name: {{ .Values.platformAgent.name }}
  namespace: {{ .Release.Namespace }}
spec:
  harness:
    clusterName: {{ .Values.platformAgent.harness.clusterName | quote }}
    location: {{ .Values.platformAgent.harness.location | quote }}
    projectId: {{ .Values.platformAgent.harness.projectId | quote }}
  deployment:
    image: "{{ .Values.platformAgent.deployment.image.repository }}:{{ .Values.platformAgent.deployment.image.tag | default .Chart.AppVersion }}"
    tag: {{ .Values.platformAgent.deployment.image.tag | default .Chart.AppVersion | quote }}
    imagePullPolicy: {{ .Values.platformAgent.deployment.image.pullPolicy }}
{{- end }}
